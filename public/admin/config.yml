# Configurazione Sveltia CMS per il sito Amon Energy.
#
# ATTENZIONE — questo file non è stato ancora validato contro un'istanza Sveltia
# CMS live: rivedere widget e hint dopo il primo test reale del pannello.

backend:
  name: github
  repo: TreniTalia/sito_amonenergy
  branch: main
  # Il backend OAuth è il servizio `cms-auth` dello stack, dietro lo stesso
  # hostname del sito: nginx inoltra /oauth/ al container, che non pubblica
  # porte. Nessun Worker Cloudflare, nessun servizio esterno.
  #
  # ATTENZIONE — `base_url` qui sotto viene RISCRITTO A RUNTIME da nginx
  # sull'host della richiesta (vedi `location = /admin/config.yml` in
  # docker/nginx.conf). Il valore scritto qui è quello di produzione e serve
  # solo come default se quella riscrittura venisse rimossa; su
  # test.amonenergy.it il pannello riceve `https://test.amonenergy.it`.
  #
  # Non è una complicazione gratuita. Le due alternative sono peggiori:
  # cablare l'host sarebbe un interruttore da girare a ogni cambio di dominio
  # (e sbagliarlo manda il login sul sito sbagliato), mentre OMETTERE base_url
  # è la trappola: Sveltia non ricade sull'origine corrente ma su
  # https://api.netlify.com — verificato, il login finirebbe su Netlify.
  base_url: https://amonenergy.it
  auth_endpoint: oauth/auth

# Commit diretto su main: per due editor interni il flusso bozze/review è
# complessità inutile (SPEC §2.3).
publish_mode: simple

media_folder: "src/assets/img/progetti"
public_folder: "/src/assets/img/progetti"

# Le foto si ridimensionano nel browser prima del caricamento: una foto da
# telefono da 12 MB finirebbe tale e quale nel repository e in ogni build.
# 2400px sul lato lungo coprono la foto più grande che il sito serve (le cover
# delle pagine tecniche, 2400px); il formato finale lo decide comunque Astro.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 2400
          height: 2400

# I contenuti bilingue vivono in due cartelle sorelle (it/ e en/), stesso nome
# di file nelle due lingue tranne per la collection `servizi-dettaglio`, dove
# lo slug del file segue la lingua (vedi il commento sulla collection stessa).
i18n:
  structure: multiple_folders
  locales: [it, en]
  default_locale: it

collections:
  - name: "progetti"
    label: "Progetti"
    label_singular: "Progetto"
    description: "Le opere dell'archivio progetti — una scheda per sottostazione."
    folder: "src/content/progetti"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "titolo"
    summary: "{{titolo}} — {{kv}}"
    media_folder: "/src/assets/img/progetti"
    public_folder: "/src/assets/img/progetti"
    # I `maxlength` non sono arbitrari: sono tarati misurando le card dello
    # slider su /lavori/ (telefono da 360px fino a desktop da 1440px). Titolo
    # in 2 righe, descrizione in 2 righe su computer e 3 su telefono, riga
    # committente · provincia · tipologia in 1 riga su computer. Alzarli fa
    # finire i testi coi puntini; il test `lavori-slider-layout` lo verifica.
    fields:
      - { label: "Titolo", name: "titolo", widget: "string", maxlength: 45, hint: "Es. \"Stazione elettrica Troia\". Massimo 45 caratteri: sulla card sta in 2 righe." }
      - { label: "Tensione (kV)", name: "kv", widget: "string", maxlength: 20, hint: "Es. \"150/30 kV\". Se non ancora nota, lasciare \"[DATO DA CONFERMARE]\": in home il chip della tensione non compare." }
      - { label: "Potenza", name: "potenza", widget: "string", required: false, maxlength: 12, hint: "Es. \"60 MW\". Compare nel chip verde della card e della galleria." }
      - { label: "Committente", name: "committente", widget: "string", maxlength: 30, hint: "Nome breve del cliente, es. \"Eco Puglia Energia\". Se non ancora noto, lasciare \"[DATO DA CONFERMARE]\": sulla card non compare." }
      - { label: "Provincia", name: "provincia", widget: "string", minlength: 2, maxlength: 2, hint: "Sigla, es. FG, PZ, AV." }
      - { label: "Tipologia", name: "tipologia", widget: "string", default: "Sottostazione AT/MT", maxlength: 30 }
      - { label: "Cover", name: "immagine", widget: "image", required: false, hint: "La foto mostrata nello slider, e la prima della galleria. Orizzontale, almeno 1600px sul lato lungo. Se manca, fa da cover la prima delle altre foto; senza nessuna foto la card mostra \"Foto in arrivo\"." }
      - { label: "Testo alternativo della cover", name: "immagineAlt", widget: "string", maxlength: 150, hint: "Descrizione della cover per chi non la vede, es. \"Trasformatore di potenza della stazione 150/30 kV di Troia al tramonto\"." }
      - { label: "Altre foto (galleria)", name: "galleria", widget: "image", multiple: true, required: false, hint: "Si vedono cliccando la card, dopo la cover. Puoi selezionarne più d'una insieme e riordinarle trascinandole. Il testo alternativo di queste foto si genera da solo." }
      - { label: "Ordine", name: "ordine", widget: "number", value_type: "int", hint: "Ordine di comparsa nello slider (1, 2, 3…). I primi 3 progetti con almeno una foto compaiono anche in home." }
      - { label: "Descrizione", name: "descrizione", widget: "text", maxlength: 100, hint: "Una frase: cosa è stato costruito e per cosa. Massimo 100 caratteri: sulla card sta in 2 righe su computer e 3 su telefono." }
      - { label: "Titolo (EN, opzionale)", name: "titoloEn", widget: "string", required: false, maxlength: 45, hint: "Mostrato su /en/projects/ e nelle card della home inglese. Se vuoto, la pagina inglese mostra il Titolo italiano." }
      - { label: "Tipologia (EN, opzionale)", name: "tipologiaEn", widget: "string", required: false, maxlength: 30, hint: "Es. \"HV/MV substation\". Se vuoto, resta la Tipologia italiana." }
      - { label: "Testo alternativo della cover (EN, opzionale)", name: "immagineAltEn", widget: "string", required: false, maxlength: 150, hint: "Se vuoto, resta il Testo alternativo italiano." }
      - { label: "Descrizione (EN, opzionale)", name: "descrizioneEn", widget: "text", required: false, maxlength: 100, hint: "La stessa frase in inglese, massimo 100 caratteri. Se vuoto, la pagina inglese mostra la Descrizione italiana. Non tradurre committente, provincia, tensione e potenza: restano identici in entrambe le lingue." }

  - name: "servizi"
    label: "Servizi"
    description: "Le 5 card servizio mostrate in home — non corrispondono più a pagine di dettaglio proprie: l'approfondimento vive tutto su /servizi/."
    i18n: true
    files:
      - name: "laboratorio-mobile"
        label: "Laboratorio mobile ricerca guasti"
        file: "src/content/servizi/{{locale}}/laboratorio-mobile.md"
        i18n: true
        fields: &servizio_fields
          - { label: "Titolo", name: "titolo", widget: "string", i18n: true }
          - { label: "Testo breve (per la card in home)", name: "excerpt", widget: "text", i18n: true }
          - { label: "Icona (es. \"fa6-solid:truck-fast\" Font Awesome, \"glass-svg:settings\" SVG del pack, \"glass-png:safety-hat\" PNG del pack)", name: "icona", widget: "string", i18n: "duplicate", hint: "Uguale in italiano e inglese: non tradurre la chiave dell'icona." }
          - { label: "Ordine", name: "ordine", widget: "number", value_type: "int", i18n: "duplicate", hint: "Stesso numero in italiano e inglese, altrimenti le card si ordinano in modo diverso nelle due lingue." }
      - name: "verifiche-strumentali"
        label: "Verifiche strumentali"
        file: "src/content/servizi/{{locale}}/verifiche-strumentali.md"
        i18n: true
        fields: *servizio_fields
      - name: "monitoraggio-e-controllo"
        label: "Monitoraggio e controllo"
        file: "src/content/servizi/{{locale}}/monitoraggio-e-controllo.md"
        i18n: true
        fields: *servizio_fields
      - name: "costruzioni"
        label: "Costruzioni"
        file: "src/content/servizi/{{locale}}/costruzioni.md"
        i18n: true
        fields: *servizio_fields
      - name: "gestione-e-manutenzione"
        label: "Gestione e manutenzione"
        file: "src/content/servizi/{{locale}}/gestione-e-manutenzione.md"
        i18n: true
        fields: *servizio_fields

  - name: "pagine"
    label: "Pagine"
    description: "Testi editabili delle pagine fisse del sito."
    i18n: true
    files:
      - name: "home"
        label: "Home"
        file: "src/content/pagine/{{locale}}/home.yaml"
        i18n: true
        fields:
          - { label: "Tipo pagina", name: "pagina", widget: "hidden", default: "home", i18n: "duplicate" }
          - label: "Hero (prima schermata)"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow (etichetta sopra il titolo)", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Titolo grande (H1)", name: "h1", widget: "text", i18n: true, hint: "Questa è la frase grande nella prima schermata della home." }
              - { label: "Sottotitolo", name: "sub", widget: "text", i18n: true }
              - { label: "Testo bottone Chiama", name: "ctaPrimaria", widget: "string", i18n: true }
              - { label: "Testo bottone Servizi", name: "ctaSecondaria", widget: "string", i18n: true }
          - label: "Chi siamo in breve"
            name: "chiSiamoBreve"
            widget: "object"
            i18n: true
            fields:
              - { label: "Testo", name: "testo", widget: "text", i18n: true }
              - { label: "Link", name: "link", widget: "string", i18n: true, hint: "Il percorso della pagina a cui rimanda, es. \"/servizi/\" in italiano e \"/en/services/\" in inglese: cambia da una lingua all'altra." }
          - label: "Numeri (StatBar)"
            name: "statbar"
            widget: "list"
            i18n: true
            hint: "4 numeri mostrati in home. Quelli segnati come \"dato finto\" vanno sostituiti con i valori reali prima del go-live."
            fields:
              - { label: "Valore (es. \"120+\" o \"850 MW\")", name: "valore", widget: "string", i18n: "duplicate", hint: "Stesso valore in italiano e inglese." }
              - { label: "Etichetta", name: "label", widget: "string", i18n: true }
              - { label: "È un dato finto/segnaposto?", name: "finto", widget: "boolean", default: true, i18n: "duplicate" }
          - label: "Perché Amon Energy (3 punti)"
            name: "percheAmon"
            widget: "list"
            i18n: true
            fields:
              - { label: "Titolo", name: "titolo", widget: "string", i18n: true }
              - { label: "Testo", name: "testo", widget: "text", i18n: true }
          - { label: "Titolo sezione clienti", name: "marqueeTitolo", widget: "string", i18n: true }

      - name: "contatti"
        label: "Contatti"
        file: "src/content/pagine/{{locale}}/contatti.yaml"
        i18n: true
        fields:
          - { label: "Tipo pagina", name: "pagina", widget: "hidden", default: "contatti", i18n: "duplicate" }
          - { label: "Titolo grande (H1)", name: "h1", widget: "text", i18n: true }
          - { label: "Sottotitolo", name: "sub", widget: "text", i18n: true }
          - { label: "Orari", name: "orari", widget: "string", i18n: true }

      - name: "servizi-hub"
        label: "Servizi"
        file: "src/content/pagine/{{locale}}/servizi.yaml"
        i18n: true
        fields:
          - { label: "Tipo pagina", name: "pagina", widget: "hidden", default: "servizi", i18n: "duplicate" }
          - { label: "Eyebrow (etichetta sopra il titolo)", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Titolo grande (H1)", name: "h1", widget: "text", i18n: true }
          - { label: "Sottotitolo", name: "sub", widget: "text", i18n: true }
          - label: "Controllo e monitoraggio"
            name: "controllo"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Titolo", name: "titolo", widget: "text", i18n: true }
              - { label: "Testo introduttivo", name: "testo", widget: "text", i18n: true }
              - label: "RCS"
                name: "rcs"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Titolo", name: "titolo", widget: "string", i18n: true }
                  - { label: "Testo", name: "testo", widget: "text", i18n: true }
                  - { label: "Specifiche (chip)", name: "specs", widget: "list", i18n: true, field: { label: "Voce", name: "item", widget: "string", i18n: true } }
              - label: "CCI"
                name: "cci"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Titolo", name: "titolo", widget: "string", i18n: true }
                  - { label: "Testo", name: "testo", widget: "text", i18n: true }
                  - { label: "Specifiche (chip)", name: "specs", widget: "list", i18n: true, field: { label: "Voce", name: "item", widget: "string", i18n: true } }
                  - { label: "Nome partner", name: "partnerNome", widget: "string", i18n: "duplicate", hint: "Nome dell'azienda partner: uguale in italiano e inglese." }
                  - { label: "Sito partner", name: "partnerUrl", widget: "string", i18n: "duplicate", hint: "Indirizzo del sito del partner: uguale in italiano e inglese." }
          - label: "Ingegneria elettrica"
            name: "ingegneriaElettrica"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Titolo", name: "titolo", widget: "text", i18n: true }
              - { label: "Sottotitolo", name: "sub", widget: "text", i18n: true }
              - label: "Voci (3 card)"
                name: "voci"
                widget: "list"
                i18n: true
                fields:
                  - { label: "Titolo", name: "titolo", widget: "string", i18n: true }
                  - { label: "Testo", name: "testo", widget: "text", i18n: true }
                  - { label: "Icona (es. \"fa6-solid:truck-fast\" Font Awesome, \"glass-svg:settings\" SVG del pack, \"glass-png:safety-hat\" PNG del pack)", name: "icona", widget: "string", i18n: "duplicate", hint: "Uguale in italiano e inglese: non tradurre la chiave dell'icona." }
          - label: "Costruzione e gestione"
            name: "costruzioneGestione"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Titolo", name: "titolo", widget: "text", i18n: true }
          - label: "Tecnologie"
            name: "tecnologie"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Titolo", name: "titolo", widget: "text", i18n: true }
              - { label: "Sottotitolo", name: "sub", widget: "text", i18n: true }
              - label: "Voci (chip)"
                name: "voci"
                widget: "list"
                i18n: "duplicate"
                hint: "Nomi di protocolli, standard e strumenti tecnici: non si traducono, restano uguali in italiano e inglese."
                fields:
                  - { label: "Nome", name: "nome", widget: "string" }
                  - { label: "Logo (modbus / mqtt / zigbee — lasciare vuoto per un chip di solo testo)", name: "logo", widget: "string", required: false }

      - name: "azienda"
        label: "Azienda"
        file: "src/content/pagine/{{locale}}/azienda.yaml"
        i18n: true
        fields:
          - { label: "Tipo pagina", name: "pagina", widget: "hidden", default: "azienda", i18n: "duplicate" }
          - { label: "Eyebrow (etichetta sopra il titolo)", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Titolo grande (H1)", name: "h1", widget: "text", i18n: true }
          - { label: "Sottotitolo della cover", name: "sub", widget: "text", i18n: true }
          - { label: "Storia: titolo", name: "storiaTitolo", widget: "string", i18n: true }
          - { label: "Storia: testo", name: "storia", widget: "text", i18n: true }
          - { label: "Missione: titolo", name: "missioneTitolo", widget: "string", i18n: true }
          - { label: "Missione: testo", name: "missione", widget: "text", i18n: true, hint: "Testo redatto dai soli fatti noti, da far validare dal cliente." }
          - { label: "Tempestività d'intervento: titolo", name: "raggioTitolo", widget: "string", i18n: true }
          - { label: "Tempestività d'intervento: testo", name: "raggioAzione", widget: "text", i18n: true }
          - { label: "Strumentazione: titolo", name: "strumentazioneTitolo", widget: "string", i18n: true }
          - { label: "Strumentazione: testo", name: "strumentazioneTesto", widget: "text", i18n: true }
          - { label: "Titolo sezione clienti", name: "marqueeTitolo", widget: "string", i18n: true }
          - label: "Strumentazione (elenco tag)"
            name: "strumentazione"
            widget: "list"
            i18n: true
            hint: "Gli strumenti reali del laboratorio mobile, uno per riga: la maggior parte sono modelli commerciali e restano identici nella versione inglese, tranne le poche voci scritte per esteso (es. \"Laboratori mobili Centrix 2.0\"), da tradurre."
            field: { label: "Strumento", name: "item", widget: "string" }

  # Le nove pagine tecniche di dettaglio (una per prova/servizio diagnostico).
  # ATTENZIONE: lo slug del file segue la lingua del contenuto, per scelta SEO
  # deliberata e già usata nei redirect (es. "cci-controllore-centrale-impianto"
  # in italiano contro "cci-central-plant-controller" in inglese; solo "sfra"
  # coincide per caso). Decap/Sveltia accoppierebbe le due lingue di una
  # collection i18n per SLUG UGUALE fra le cartelle it/ ed en/: con slug
  # diversi l'editor mostrerebbe il lato di una lingua come vuoto anche se il
  # file esiste dall'altra parte — un accoppiamento che si rompe in silenzio.
  # Per questo la collection NON è i18n: sono due collection di cartella
  # distinte, una per lingua, con gli stessi campi (condivisi con
  # l'ancora YAML qui sotto) ma editate separatamente. È responsabilità di chi
  # scrive tenere allineati manualmente i valori che devono restare identici
  # fra le due pagine gemelle (ordine, disegno, codice norma, progetto
  # collegato) — i relativi hint lo ricordano campo per campo.
  - name: "servizi-dettaglio-it"
    label: "Pagine tecniche (italiano)"
    label_singular: "Pagina tecnica (IT)"
    description: "Le nove pagine italiane di approfondimento su prove e sistemi diagnostici, una per servizio."
    folder: "src/content/servizi-dettaglio/it"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "titolo"
    summary: "{{titolo}}"
    fields: &servizio_dettaglio_fields
      - { label: "Titolo", name: "titolo", widget: "string", hint: "Il titolo della pagina, es. \"Prova SFRA sui trasformatori di potenza\"." }
      - { label: "Testo introduttivo (lead)", name: "lead", widget: "text", hint: "2-3 righe subito sotto il titolo: che cos'è la prova e perché serve." }
      - { label: "Foto di cover", name: "copertina", widget: "image", media_folder: "/src/assets/img/tech/cover", public_folder: "../../../assets/img/tech/cover", hint: "Foto orizzontale 3:2, almeno 2400px. Usa la stessa foto sulla pagina gemella nell'altra lingua." }
      - { label: "Testo alternativo della cover", name: "copertinaAlt", widget: "string", hint: "Descrive la foto per chi non la vede, nella lingua della pagina." }
      - { label: "Titolo SEO", name: "seoTitle", widget: "string", hint: "Il titolo che compare su Google, diverso dal titolo grande della pagina." }
      - { label: "Descrizione SEO", name: "seoDescription", widget: "text", hint: "1-2 righe che compaiono sotto il link nei risultati Google." }
      - { label: "Ordine", name: "ordine", widget: "number", value_type: "int", hint: "Stesso numero della pagina gemella nell'altra lingua, altrimenti le pagine si ordinano in modo diverso nelle due lingue." }
      - { label: "Area", name: "area", widget: "select", options: [{ label: "Diagnostica strumentale", value: "diagnostica" }, { label: "Controllo e monitoraggio", value: "controllo" }], hint: "La colonna in cui la pagina compare nell'indice \"Approfondimenti tecnici\" di /servizi/. Stesso valore della pagina gemella nell'altra lingua." }
      - label: "Disegno tecnico"
        name: "diagramma"
        widget: "select"
        hint: "Il disegno mostrato nella pagina. Scegli lo stesso disegno della pagina gemella nell'altra lingua: un valore fuori da questo elenco lascerebbe la pagina senza disegno."
        options:
          - { label: "Grafico risposta in frequenza (SFRA)", value: "risposta-frequenza" }
          - { label: "Schema misura scariche parziali", value: "scariche-parziali" }
          - { label: "Curva tempo-corrente (protezioni)", value: "curva-tempo-corrente" }
          - { label: "Punti di misura sul trasformatore", value: "punti-misura-trasformatore" }
          - { label: "Rampa di prova isolamento", value: "rampa-isolamento" }
          - { label: "Catena di controllo RCS", value: "catena-rcs" }
          - { label: "Schema osservabilità e controllabilità (CCI)", value: "osservabilita-controllabilita" }
          - { label: "Catena teledistacco A72", value: "catena-a72" }
          - { label: "Catena lettura contatori", value: "catena-contatori" }
      - label: "Il problema (2-3 paragrafi)"
        name: "problema"
        widget: "list"
        hint: "Il corpo centrale della pagina: perché questa prova serve e che cosa rischia chi non la fa. Almeno 2 paragrafi, uno per riga dell'elenco."
        field: { label: "Paragrafo", name: "item", widget: "text" }
      - label: "Parametri della prova (almeno 4 card)"
        name: "parametri"
        widget: "list"
        hint: "Le card con i numeri e le caratteristiche della prova (banda, tensione, durata...). Almeno 4."
        fields:
          - { label: "Titolo", name: "titolo", widget: "string" }
          - { label: "Testo", name: "testo", widget: "text" }
          - { label: "Icona (es. \"fa6-solid:bolt\")", name: "icona", widget: "string", hint: "La stessa chiave icona della pagina gemella nell'altra lingua: non si traduce." }
      - label: "Fasi dell'intervento (almeno 3)"
        name: "fasi"
        widget: "list"
        hint: "I passi con cui si svolge la prova sul campo, in ordine cronologico."
        fields:
          - { label: "Titolo", name: "titolo", widget: "string" }
          - { label: "Testo", name: "testo", widget: "text" }
      - label: "Strumentazione impiegata (almeno 1)"
        name: "strumentazione"
        widget: "list"
        hint: "Gli apparecchi usati in questa prova specifica."
        fields:
          - { label: "Modello", name: "modello", widget: "string", hint: "Il nome dell'apparecchio. Un nome commerciale (es. \"Megger HV Test 80 kV\") resta uguale nella pagina gemella; una descrizione generica (es. \"Analizzatore di risposta in frequenza\") va invece tradotta lì." }
          - { label: "Ruolo nella prova", name: "nota", widget: "string", hint: "Una parola o due, es. \"Misura\" o \"Messa a terra\"." }
      - label: "Assetto di misura (facoltativo)"
        name: "assettoMisura"
        widget: "list"
        required: false
        hint: "Come si misura — tensione di prova, banda, cablaggio, messa a terra. Non tutte le pagine ce l'hanno: i sistemi (RCS, CCI, teledistacco, lettura contatori) non sono prove strumentali e questo campo va lasciato vuoto."
        fields:
          - { label: "Etichetta", name: "etichetta", widget: "string" }
          - { label: "Valore", name: "valore", widget: "string" }
      - label: "Norma di riferimento"
        name: "norma"
        widget: "object"
        fields:
          - { label: "Codice (es. \"IEC 60076-18\")", name: "codice", widget: "string", hint: "Stesso codice della pagina gemella nell'altra lingua: non si traduce un codice di norma." }
          - { label: "Titolo della norma", name: "titolo", widget: "text" }
          - { label: "Nota esplicativa", name: "note", widget: "text" }
      - label: "Caso reale (facoltativo)"
        name: "caso"
        widget: "object"
        required: false
        hint: "Un riferimento a un progetto reale dell'archivio Progetti in cui è stata eseguita questa prova. Lasciare vuoto se non c'è ancora un caso da raccontare."
        fields:
          - { label: "Progetto collegato (slug, es. \"banzi-montemilone\")", name: "progetto", widget: "string", hint: "Lo slug del progetto nell'archivio Progetti: stesso valore nella pagina gemella, perché i progetti non hanno una versione inglese propria." }
          - { label: "Testo del caso", name: "testo", widget: "text" }
      - label: "Domande frequenti (almeno 3)"
        name: "faq"
        widget: "list"
        fields:
          - { label: "Domanda", name: "d", widget: "string" }
          - { label: "Risposta", name: "r", widget: "text" }
      - label: "Pagine correlate (almeno 2)"
        name: "correlati"
        widget: "list"
        hint: "Gli slug di altre pagine tecniche da proporre in fondo alla pagina, nella STESSA lingua di questa pagina (lo slug della pagina gemella nell'altra lingua è diverso)."
        field: { label: "Slug pagina", name: "item", widget: "string" }

  - name: "servizi-dettaglio-en"
    label: "Pagine tecniche (inglese)"
    label_singular: "Pagina tecnica (EN)"
    description: "Le nove pagine inglesi di approfondimento su prove e sistemi diagnostici, una per servizio."
    folder: "src/content/servizi-dettaglio/en"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "titolo"
    summary: "{{titolo}}"
    fields: *servizio_dettaglio_fields
