<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3253"/>
      <stop offset="1" stop-color="#0a2a44"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1d5585" stroke-width="1" opacity="0.18">
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600"/>
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <g fill="none" stroke="#7ea6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- incoming AT line -->
    <path d="M800 90 V150"/>
    <!-- disconnector (gap + angled blade) -->
    <path d="M800 150 V180"/>
    <path d="M800 210 L818 182"/>
    <circle cx="800" cy="180" r="3.5" fill="#7ea6c4" stroke="none"/>
    <circle cx="800" cy="210" r="3.5" fill="#7ea6c4" stroke="none"/>
    <path d="M800 210 V250"/>
    <!-- circuit breaker (square) -->
    <rect x="784" y="250" width="32" height="46" rx="2"/>
    <path d="M800 296 V330"/>
  </g>

  <!-- 150 kV busbar -->
  <rect x="470" y="330" width="660" height="6" rx="3" fill="#4fb3d9"/>
  <text x="1150" y="326" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="600" fill="#4fb3d9" letter-spacing="1">150 kV</text>

  <g fill="none" stroke="#7ea6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- drop to transformer -->
    <path d="M800 336 V430"/>
    <!-- transformer: two coupled windings -->
    <circle cx="800" cy="470" r="42"/>
    <circle cx="800" cy="530" r="42"/>
    <path d="M800 572 V640"/>
  </g>

  <!-- MT busbar -->
  <rect x="360" y="640" width="880" height="6" rx="3" fill="#3e8e5a"/>
  <text x="1258" y="636" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="600" fill="#3e8e5a" letter-spacing="1">30 kV</text>

  <!-- MT feeders -->
  <g fill="none" stroke="#7ea6c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <path d="M480 646 V706"/><rect x="464" y="706" width="32" height="44" rx="2"/><path d="M480 750 V840"/>
      <path d="M466 840 H494 M470 852 H490 M474 864 H486"/>
    </g>
    <g>
      <path d="M660 646 V706"/><rect x="644" y="706" width="32" height="44" rx="2"/><path d="M660 750 V840"/>
      <path d="M646 840 H674 M650 852 H670 M654 864 H666"/>
    </g>
    <g>
      <path d="M840 646 V706"/><rect x="824" y="706" width="32" height="44" rx="2"/><path d="M840 750 V840"/>
      <path d="M826 840 H854 M830 852 H850 M834 864 H846"/>
    </g>
    <g>
      <path d="M1020 646 V706"/><rect x="1004" y="706" width="32" height="44" rx="2"/><path d="M1020 750 V840"/>
      <path d="M1006 840 H1034 M1010 852 H1030 M1014 864 H1026"/>
    </g>
  </g>

  <text x="120" y="150" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8eff5" letter-spacing="1">SCHEMA UNIFILARE</text>
  <text x="120" y="188" font-family="Inter, Arial, sans-serif" font-size="20" fill="#7ea6c4">Stazione di trasformazione AT/MT</text>
</svg>
