<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Schema unifilare di una stazione di trasformazione AT/MT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0e3357"/>
      <stop offset="0.55" stop-color="#0b2c49"/>
      <stop offset="1" stop-color="#081f34"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#04121f" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="busHV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb3d9" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#7fd3f2"/>
      <stop offset="1" stop-color="#4fb3d9" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="busMV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e8e5a" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#68e59a"/>
      <stop offset="1" stop-color="#3e8e5a" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- faint engineering grid -->
  <g stroke="#3a6d94" stroke-width="1" opacity="0.12">
    <path d="M0 250H1600M0 500H1600M0 750H1600"/>
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <!-- title block -->
  <text x="96" y="118" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#eaf3fb">SCHEMA UNIFILARE</text>
  <rect x="96" y="138" width="52" height="3" rx="1.5" fill="#4fb3d9"/>
  <text x="164" y="146" font-family="Inter, Arial, sans-serif" font-size="21" fill="#8fb6d4">Stazione di trasformazione AT / MT</text>

  <!-- ===== single line, centred on x=800 ===== -->
  <g fill="none" stroke="#9cc0dc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- incoming AT line -->
    <path d="M800 170 V235"/>
    <!-- disconnector (sezionatore): gap + angled blade -->
    <path d="M800 265 L822 232"/>
    <path d="M800 295 V352"/>
    <!-- circuit breaker (interruttore): square -->
    <rect x="782" y="352" width="36" height="52" rx="4"/>
    <path d="M800 404 V452"/>
    <!-- drop to transformer -->
    <path d="M800 556 V566"/>
    <path d="M800 690 V748"/>
    <!-- transformer windings -->
    <circle cx="800" cy="512" r="46"/>
    <circle cx="800" cy="600" r="46"/>
  </g>

  <!-- terminal nodes -->
  <g fill="#9cc0dc">
    <circle cx="800" cy="265" r="5"/>
    <circle cx="800" cy="295" r="5"/>
  </g>

  <!-- 150 kV busbar with glow -->
  <rect x="452" y="449" width="696" height="7" rx="3.5" fill="url(#busHV)" filter="url(#glow)"/>
  <rect x="452" y="449.5" width="696" height="6" rx="3" fill="#8fd8f5"/>
  <text x="1168" y="444" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1" fill="#7fd3f2">150 kV</text>

  <!-- 30 kV busbar with glow -->
  <rect x="352" y="745" width="896" height="7" rx="3.5" fill="url(#busMV)" filter="url(#glow)"/>
  <rect x="352" y="745.5" width="896" height="6" rx="3" fill="#68e59a"/>
  <text x="1268" y="740" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1" fill="#68e59a">30 kV</text>

  <!-- MT feeders (montanti) -->
  <g fill="none" stroke="#9cc0dc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <path d="M512 752 V812"/><rect x="494" y="812" width="36" height="50" rx="4"/><path d="M512 862 V928"/>
      <path d="M490 928 H534 M496 940 H528 M502 952 H522"/>
    </g>
    <g>
      <path d="M704 752 V812"/><rect x="686" y="812" width="36" height="50" rx="4"/><path d="M704 862 V928"/>
      <path d="M682 928 H726 M688 940 H720 M694 952 H714"/>
    </g>
    <g>
      <path d="M896 752 V812"/><rect x="878" y="812" width="36" height="50" rx="4"/><path d="M896 862 V928"/>
      <path d="M874 928 H918 M880 940 H912 M886 952 H906"/>
    </g>
    <g>
      <path d="M1088 752 V812"/><rect x="1070" y="812" width="36" height="50" rx="4"/><path d="M1088 862 V928"/>
      <path d="M1066 928 H1110 M1072 940 H1104 M1078 952 H1098"/>
    </g>
  </g>

  <!-- glowing current packets on the incoming line -->
  <g filter="url(#softglow)">
    <circle cx="800" cy="196" r="6" fill="#eaffff"/>
    <circle cx="800" cy="430" r="5" fill="#bff0ff"/>
  </g>
  <circle cx="800" cy="196" r="3" fill="#ffffff"/>

  <!-- component labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="19" fill="#7ea6c4">
    <text x="856" y="262">Sezionatore</text>
    <text x="856" y="386">Interruttore</text>
    <text x="872" y="562">Trasformatore</text>
    <text x="872" y="588" fill="#8fb6d4">150 / 30 kV</text>
  </g>
  <text x="512" y="990" font-family="Archivo, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#5f89a8" text-anchor="middle">MONTANTI MT</text>

  <rect width="1600" height="1000" fill="url(#vign)"/>
</svg>
