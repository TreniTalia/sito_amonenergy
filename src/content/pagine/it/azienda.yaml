pagina: "azienda"

eyebrow: "Chi siamo"
h1: "Professionisti dell'energia, dal 2020."
sub: "Oltre vent'anni di lavoro sugli impianti elettrici AT/MT, da un'unica sede in Puglia al servizio delle rinnovabili del Centro-Sud."

storiaTitolo: "Vent'anni di stazioni elettriche, una sola squadra."
storia: "L'esperienza di Amon Energy affonda le radici nel 2000: fondata come PL System, poi Energy System, con oltre 100 stazioni AT/MT realizzate e contratti O&M su più di 30 stazioni nel Sud Italia, fino all'acquisizione da parte del Gruppo BayWa r.e. nel 2019. Nel 2020 Mario Palumbo e Ludovico Lombardi fondano Amon Energy S.r.l., riunendo in un'unica realtà oltre vent'anni di competenza sugli impianti elettrici AT/MT, oggi al servizio delle energie rinnovabili nel Centro-Sud Italia."

# NOTA: testo redatto a partire dai soli fatti presenti nello spec (fondazione 2020,
# soci, Energy System Services, 20+ anni di esperienza, focus rinnovabile Centro-Sud).
# Da far rivedere/validare dal cliente prima del go-live: non è testo brochure verbatim.
missioneTitolo: "Al fianco di chi produce energia, in ogni fase della vita di un impianto."
missione: "Affianchiamo gli operatori del settore energetico dalla costruzione alla verifica, fino alla gestione di tutti i giorni. Lo facciamo con la competenza tecnica maturata in oltre vent'anni di lavoro su impianti elettrici civili, industriali e AT/MT, che oggi mettiamo al servizio delle rinnovabili nel Centro-Sud Italia."

raggioTitolo: "Una sede baricentrica, a poche ore dagli impianti."
raggioAzione: "Sede unica da 5.000 m² a Castelluccio dei Sauri (FG), con magazzino ricambi strategico e Control Room attiva 24/7/365. Da qui raggiungiamo la maggior parte degli impianti del Centro-Sud in poche ore, e quando un guasto non può aspettare è questo che fa la differenza."

strumentazioneTitolo: "La nostra dotazione tecnica."
strumentazioneTesto: "Strumenti di prova tarati e verificati, a bordo dei nostri laboratori mobili. Arriviamo in campo con tutto quello che serve per misurare, senza dover rimandare la prova."

