eyebrow: "About us"
h1: "Energy professionals, since 2020."

storia: "Amon Energy's experience is rooted in 2000: founded as PL System, then Energy System, with over 100 HV/MV substations built and O&M contracts on more than 30 substations across Southern Italy, up to the acquisition by the BayWa r.e. Group in 2019. In 2020 Mario Palumbo and Ludovico Lombardi founded Amon Energy S.r.l., bringing together over twenty years of expertise in HV/MV electrical plants into a single company, now serving renewable energy across Central-Southern Italy."

# NOTE: text drafted from the facts stated in the spec alone (founded 2020,
# partners, Energy System Services, 20+ years of experience, renewables focus
