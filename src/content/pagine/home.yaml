pagina: "home"

hero:
  eyebrow: "Professionisti dell'energia"
  h1: "Tecnologia e gestione operativa degli impianti energetici."
  sub: "System Integrator, sottostazioni AT/MT, verifiche strumentali, ricerca guasti e monitoraggio 24/7 per impianti eolici e fotovoltaici."
  ctaPrimaria: "Chiamaci: 0881 377590"
  ctaSecondaria: "Scopri i servizi"

chiSiamoBreve:
  testo: "Da oltre 20 anni costruiamo stazioni AT/MT e gestiamo impianti nel Centro - Sud Italia. Un’unica base operativa strategica, Control Room sempre attiva e ricambi pronti: così interveniamo in tempi record e teniamo i tuoi impianti sempre in produzione."
  link: "/azienda/"

controllo:
  eyebrow: "Control Room · RCS · CCI"
  titolo: "Il cuore digitale dei tuoi impianti, sempre acceso."
  testo: "Dalla nostra Control Room in Puglia sorvegliamo gli impianti in tempo reale, 24 ore su 24. Il sistema proprietario RCS analizza i guasti e richiude in automatico; il Controllore Centrale d'Impianto (CCI) tiene tutto conforme alle norme. Quando serve un intervento, il team parte dalla sede con il laboratorio mobile."

