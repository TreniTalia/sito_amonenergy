pagina: "home"

hero:
  eyebrow: "System Integrator per l'energia"
  h1: "Conosciamo l'impianto. Costruiamo il software che lo controlla."
  sub: "Ingegneria elettrica, automazione e controllo remoto in un'unica squadra: progettiamo sottostazioni AT/MT e ci costruiamo sopra i sistemi software, il monitoraggio e l'analisi dati che le tengono sempre in produzione."
  ctaPrimaria: "Chiamaci: 0881 377590"
  ctaSecondaria: "Scopri i servizi"

# NOTA: storia redatta a partire dai fatti già in azienda.yaml (fondazione 2020,
# soci, PL System / Energy System, acquisizione BayWa r.e. 2019, sede 5.000mq).
# Stessa cautela: da far rivedere/validare dal cliente prima del go-live.
chiSiamoBreve:
  testo: "L'esperienza di Amon Energy comincia nel 2000, come PL System e poi come Energy System: oltre 100 stazioni AT/MT realizzate e contratti O&M su più di 30 impianti nel Sud Italia, fino all'acquisizione da parte del Gruppo BayWa r.e. nel 2019. Nel 2020 Mario Palumbo e Ludovico Lombardi fondano Amon Energy S.r.l., riunendo oltre vent'anni di competenza sugli impianti elettrici AT/MT in un'unica realtà oggi al servizio delle energie rinnovabili nel Centro-Sud Italia. Un'unica sede da 5.000 m² a Castelluccio dei Sauri (FG), baricentrica, con magazzino ricambi e Control Room attiva 24/7/365."
  link: "/servizi/"

controllo:
  eyebrow: "Remote Control System · CCI"
  titolo: "Il cuore digitale dei tuoi impianti, sempre acceso."
  testo: "Dalla nostra Control Room in Puglia sorvegliamo gli impianti in tempo reale, 24 ore su 24. Il sistema proprietario RCS analizza i guasti e richiude in automatico; il Controllore Centrale d'Impianto (CCI) tiene tutto conforme alle norme. Quando serve un intervento, il team parte dalla sede con il laboratorio mobile."

