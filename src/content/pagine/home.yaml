percheAmon:
  - titolo: "Rapidità"
    testo: "Sede operativa a Castelluccio dei Sauri (FG), baricentrica: raggiungiamo la maggior parte degli impianti del Centro-Sud in poche ore, con reperibilità 24h."
  - titolo: "Affidabilità"
    testo: "Personale qualificato CEI EN 50110-1 e CEI 11-27, con oltre 100 stazioni AT/MT realizzate e piena responsabilità sulla sicurezza e l'operatività elettrica."
  - titolo: "Tecnologia"
    testo: "Control Room 24/7, sistema RCS proprietario e laboratori mobili Centrix 2.0 con strumentazione ISA, Megger HV 80kV, OTDR e termografia — tutta certificata e calibrata."

