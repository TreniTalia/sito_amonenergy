# nginx per il sito statico Amon Energy.
#
# Sostituisce integralmente public/.htaccess (Apache), che è stato eliminato:
# i redirect 301 dai vecchi URL WordPress, il 404 custom e le regole di cache
# vivono qui. Questo file viene incluso da nginx dentro il contesto `http`,
# quindi il `map` qui sotto è al posto giusto.

# Redirect 301 dai vecchi URL WordPress.
#
# Nota su una differenza voluta rispetto all'originale: `Redirect 301 /centrix/ …`
# di Apache matcha per prefisso e quindi NON copriva la forma senza slash finale
# (`/centrix` cadeva in 404). I pattern qui la coprono con `/?$`.
#
# Mappa completa dei 27 vecchi URL del page-sitemap.xml (vedi test
# `redirects.test.mjs`, VECCHI_URL). Ordine scelto: prima le pagine figlie di
# secondo livello, poi il genitore che le raccoglieva. I pattern sono ancorati
# con `/?$`, quindi un figlio non può mai combaciare con la regex del genitore
# (che richiede fine stringa subito dopo il suo stesso segmento): l'ordine qui
# non è quindi necessario per la correttezza, ma tenerlo esplicito evita che la
# prossima riga aggiunta senza pensarci rompa la mappa in silenzio.
map $uri $legacy_redirect {
    default                              "";

    # /progetti/ = portfolio lavori eseguiti. /foto-video/ era la galleria
    # multimediale dello stesso portfolio: nel nuovo sito è confluita nella
    # stessa pagina /lavori/, non ha una destinazione propria.
    ~^/progetti/?$                       /lavori/;
    ~^/foto-video/?$                     /lavori/;

    # Figli di /verifiche-strumentali/: ciascuno è diventato una pagina
    # servizio autonoma sotto /servizi/. Lo slug
    # "verifiche-trasformatori-potenza-misure" cambia in
    # "verifiche-trasformatori-di-potenza" (Task 5, src/i18n/routes.ts).
    ~^/verifiche-strumentali/sfra/?$                                     /servizi/sfra/;
    ~^/verifiche-strumentali/misure-scariche-parziali/?$                 /servizi/misure-scariche-parziali/;
    ~^/verifiche-strumentali/verifica-protezioni-at-mt/?$                /servizi/verifica-protezioni-at-mt/;
    ~^/verifiche-strumentali/verifiche-trasformatori-potenza-misure/?$   /servizi/verifiche-trasformatori-di-potenza/;
    ~^/verifiche-strumentali/?$          "/servizi/#ingegneria-elettrica";

    # /prove-isolamento/ non aveva figli: era già una pagina di secondo livello
    # nel vecchio sito (sotto /verifiche-strumentali/ solo nel menu, non
    # nell'URL) e diventa la pagina servizio omonima.
    ~^/prove-isolamento/?$               /servizi/prove-isolamento/;

    ~^/laboratorio-mobile/?$             "/servizi/#ingegneria-elettrica";
    ~^/centrix/?$                        "/servizi/#ingegneria-elettrica";

    # Figli di /monitoraggio-controllo/: stesso trattamento, ciascuno è una
    # pagina servizio a sé.
    ~^/monitoraggio-controllo/rcs-monitoraggio-e-controllo-cabina-mt/?$   /servizi/rcs-monitoraggio-cabina-mt/;
    ~^/monitoraggio-controllo/cci-controllore-centrale-dimpianto/?$       /servizi/cci-controllore-centrale-impianto/;
    ~^/monitoraggio-controllo/teledistacco-a72/?$                        /servizi/teledistacco-a72/;
    ~^/monitoraggio-controllo/lettura-contatori/?$                       /servizi/lettura-contatori/;
    ~^/monitoraggio-controllo/?$         "/servizi/#controllo-e-monitoraggio";

    ~^/gestione-e-manutenzione/?$        "/servizi/#costruzione-e-gestione";
    ~^/repowering-e-revamping-eolico/?$  "/servizi/#costruzione-e-gestione";

    ~^/i-nostri-clienti/?$               "/azienda/#clienti";
    ~^/lavora-con-noi/?$                 /contatti/;
    ~^/consulenza/?$                     /contatti/;

    # Sezione inglese del vecchio sito: stessa struttura di contenuti, ma con
    # meno pagine (niente equivalenti dirette per verifiche-strumentali o
    # monitoraggio-controllo nel loro insieme, solo per il prodotto RCS).
    # Le pagine /en/ riusano DELIBERATAMENTE gli id italiani nelle ancore
    # condivise (vedi il commento in src/pages/en/company.astro e gli
    # `id="ingegneria-elettrica"` / `id="costruzione-e-gestione"` in
    # src/pages/en/services/index.astro): non esistono id inglesi separati,
    # quindi le destinazioni qui sotto puntano alle stesse ancore italiane.
    # /our-job/ ("Our job") non è un portfolio lavori nonostante il nome: la
    # pagina reale (verificata sul vecchio sito, ancora online il
    # 2026-09-22) elenca servizi di verifica strumentale e manutenzione
    # (protezioni AT/MT, termografia, control room 24/7) con un modulo di
    # richiesta consulenza — è la gemella inglese di /verifiche-strumentali/
    # e /monitoraggio-controllo/ insieme, quindi va sulla pagina servizi.
    ~^/company/?$                        /en/company/;
    ~^/our-job/?$                        /en/services/;
    ~^/our-clients/?$                    "/en/company/#clienti";
    ~^/rcs/?$                            /en/services/rcs-mv-substation-monitoring/;
    ~^/centrix-2-0/?$                    "/en/services/#ingegneria-elettrica";
    ~^/contacts/?$                       /en/contacts/;
    ~^/repowering-eolic-revamping/?$     "/en/services/#costruzione-e-gestione";

    ~^/sitemap_index\.xml$               /sitemap-index.xml;
    ~^/page-sitemap\.xml$                /sitemap-index.xml;
    ~^/feed/?$                           /;
    ~^/comments/feed/?$                  /;
}

# La home inglese del vecchio sito era `/?lang=en`, e `map $uri` la query
# string non la vede: per nginx quell'URL ha $uri uguale a "/". Serve quindi
# una mappa sull'argomento, applicata solo quando $uri è esattamente "/".
#
# Trattamento concordato con il cliente: best practice, non requisito
# bloccante. Se questo blocco mostra un comportamento anomalo sulla home
# italiana in fase di crawl, si rimuove — un singolo redirect perso vale meno
# della home, che è la pagina più importante del sito.
map $arg_lang $home_en {
    default  "";
    en       /en/;
}

# Schema originale della richiesta: dietro il reverse proxy dell'host arriva in
# X-Forwarded-Proto, in esecuzione diretta quell'header non c'è.
map $http_x_forwarded_proto $forwarded_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

# Host della richiesta CON la porta. Serve a riscrivere il base_url del
# pannello: $host la porta la butta via, e su un ambiente raggiunto come
# localhost:8082 produrrebbe un base_url senza porta, quindi inutilizzabile.
# Si usa deliberatamente l'header Host e non X-Forwarded-Host: quest'ultimo è
# falsificabile da un client esterno, e da qui esce un valore che il pannello
# usa come destinazione del login.
map $http_host $req_host {
    default  $http_host;
    ""       $host;
}

# Indicizzazione consentita SOLO sul dominio di produzione.
#
# La stessa immagine gira su test.amonenergy.it e (in futuro) su amonenergy.it.
# Un ambiente di test raggiungibile e indicizzabile si fa indicizzare: il sito
# finisce due volte in SERP e si mangia da solo il ranking — lo stesso danno che
# i redirect 301 qui sopra servono a evitare. La whitelist è sul dominio reale,
# non una blacklist del test: così qualunque host non previsto (il sottodominio
# di test, l'IP nudo, un futuro staging) nasce noindex, e il giorno del passaggio
# in produzione non c'è nessun interruttore da ricordarsi di girare.
#
# Nota: si usa X-Robots-Tag e non un Disallow in robots.txt. Un Disallow
# impedirebbe a Google di leggere la pagina, e quindi anche di vedere il
# noindex: una pagina già nota resterebbe indicizzata. Per de-indicizzare
# bisogna farsi leggere.
map $host $robots_tag {
    default            "noindex, nofollow";
    amonenergy.it      "";
}

# Canonicalizzazione del dominio: vince amonenergy.it nudo.
#
# Senza questo blocco nginx serve lo stesso contenuto su amonenergy.it e su
# www.amonenergy.it, e per Google sono due siti identici che si dividono i
# segnali. $request_uri conserva path e query string, quindi il redirect è
# valido anche per gli URL profondi e non crea una catena: chi arriva su
# www/vecchio-url fa un solo salto verso il dominio nudo, dove poi la mappa
# legacy lo manda a destinazione. Due salti in quel caso sono inevitabili e
# riguardano solo chi digita il www su un vecchio indirizzo.
server {
    listen 80;
    server_name www.amonenergy.it;
    return 301 https://amonenergy.it$request_uri;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # CRITICO dietro reverse proxy. nginx qui dentro ascolta sulla 80, ma il
    # mondo esterno arriva su HTTP_PORT (8082) in HTTPS. Con absolute_redirect
    # attivo (default), il redirect di cortesia /lavori -> /lavori/ emetterebbe
    # "Location: http://<host>:80/lavori/", perdendo schema e porta pubblica e
    # mandando il visitatore su un URL inesistente. Con off il Location è
    # relativo e il browser conserva l'origine da cui è arrivato.
    absolute_redirect off;

    # DNS interno di Docker. Serve per la resolution a runtime dell'upstream
    # cms-auth: vedi il commento in location /oauth/.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/woff2;

    # Sostituisce `ErrorDocument 404 /404.html`.
    error_page 404 /404.html;

    # I redirect legacy prima di qualunque tentativo di servire file.
    if ($legacy_redirect) {
        return 301 $legacy_redirect;
    }

    # Home inglese storica `/?lang=en` (vedi map $home_en sopra). Solo la
    # radice esatta: non deve toccare nessun altro path, e in particolare non
    # deve mai poter mandare in loop la home italiana. Senza query string
    # $home_en è vuoto (branch "default" della map) e si cade nel try_files
    # normale, quindi `https://amonenergy.it/` risponde 200 e non redirige.
    #
    # Stessi header di sicurezza e X-Robots-Tag della `location /` generica più
    # sotto: essendo un match esatto ha la precedenza su quella e altrimenti la
    # home perderebbe in silenzio no-store, security header e noindex sui
    # domini di staging.
    location = / {
        if ($home_en) { return 301 $home_en; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files /index.html =404;
    }

    # Endpoint del vecchio WordPress. 410 e non 404: dichiara al crawler che
    # l'URL è sparito in modo definitivo, e taglia il rumore dei bot che
    # continuano a sondare le installazioni WordPress.
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json) {
        return 410;
    }

    # Healthcheck del container. Fuori dagli access log per non inquinarli con
    # una richiesta ogni 30 secondi.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend OAuth del pannello /admin (servizio cms-auth dello stack).
    # cms-auth non pubblica porte: è raggiungibile solo da qui.
    #
    # `^~` e non un prefisso semplice: senza di esso la location regex degli
    # asset più sotto avrebbe la precedenza su questa.
    #
    # proxy_pass con una variabile e non con il nome letterale: nginx risolve
    # gli upstream letterali all'avvio e si RIFIUTA DI PARTIRE se il nome non
    # risolve. Con il nome in una variabile la resolution avviene a runtime,
    # quindi se cms-auth è giù o non è ancora partito il sito resta online e
    # solo /oauth/ risponde 502 — un problema del CMS non deve buttare giù le
    # pagine pubbliche.
    location ^~ /oauth/ {
        set $cms_auth "http://cms-auth:8080";
        proxy_pass $cms_auth$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # Asset fingerprintati da Astro: il nome contiene un hash del contenuto e
    # cambia a ogni build, quindi la cache può essere eterna e immutable.
    # Corrisponde alle regole mod_expires "1 year" del vecchio .htaccess.
    #
    # `expires` non si usa qui: emetterebbe un proprio Cache-Control che si
    # SOMMEREBBE a quello di add_header, mandando al browser due header
    # Cache-Control in conflitto. Un solo header, scritto per esteso.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Il base_url del pannello, riscritto sull'host da cui la richiesta arriva.
    #
    # Sveltia costruisce l'URL del login come <base_url>/<auth_endpoint>, e
    # base_url è obbligatorio: omesso, NON ricade sull'origine corrente ma su
    # https://api.netlify.com (verificato sul pannello reale). Cablarlo nel file
    # manderebbe il login su amonenergy.it anche quando il sito gira su
    # test.amonenergy.it. Riscrivendolo qui, la stessa immagine funziona su
    # qualunque host e al go-live non c'è nulla da cambiare.
    #
    # `location =` è una corrispondenza esatta: ha la precedenza sul prefisso
    # ^~ /admin/ qui sotto, quindi questo blocco vince per questo singolo file.
    location = /admin/config.yml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # `*` copre qualunque Content-Type che nginx assegni a .yml, che varia
        # fra versioni: senza questo la sostituzione fallirebbe in silenzio.
        # È circoscritto a questa location, non tocca il resto del sito.
        sub_filter_types *;
        sub_filter 'base_url: https://amonenergy.it' 'base_url: $forwarded_proto://$req_host';
        sub_filter_once on;
    }

    # Il pannello: HTML e config.yml devono poter cambiare subito, mai in cache.
    # Sveltia CMS usa routing su hash (#/collections/…), quindi non serve un
    # fallback SPA: i path reali sono solo index.html e config.yml.
    location ^~ /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    location = /robots.txt { expires 1d; }

    location ~* ^/sitemap.*\.xml$ { expires 1d; }

    # Documenti pubblici, favicon e immagini non fingerprintate: cambiano
    # raramente ma il nome non varia, quindi cache moderata e non immutable.
    location ~* \.(?:pdf|txt|ico|png|jpe?g|svg|webp|avif|woff2)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # .mjs (worker maplibre-gl in public/vendor/) manca da /etc/nginx/mime.types
    # nell'immagine nginx:1.27-alpine: senza questo finisce sul default_type
    # globale, application/octet-stream. I browser applicano MIME check
    # rigido sui module script e rifiutano di caricarlo con quel
    # Content-Type ("Failed to load module script: ... non-JavaScript MIME
    # type"). In locale funziona perché il dev server di Vite imposta da sé
    # il Content-Type corretto per .mjs.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # HTML. no-store perché una modifica fatta dal pannello /admin deve essere
    # visibile appena lo stack viene ricreato: era il ruolo della purge cache
    # manuale su SiteGround, che con questo non serve più.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # Vuoto sul dominio di produzione: nginx omette un add_header il cui
        # valore è una stringa vuota, quindi in produzione l'header non compare
        # affatto invece di comparire vuoto.
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ =404;
    }
}
