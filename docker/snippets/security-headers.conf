# Header di sicurezza per le risposte HTML.
#
# Perché uno snippet incluso invece di tre righe nel blocco server: in nginx
# `add_header` dentro una location NON eredita gli `add_header` del blocco
# genitore, li sostituisce in blocco. Ogni location che imposta un proprio
# header (qui: Cache-Control) perderebbe quindi questi tre. Includere lo
# snippet dove serve è l'unico modo pulito di non dipendere da quella regola.
#
# HSTS non è qui: lo imposta il reverse proxy dell'host, che è l'unico a sapere
# se e come il TLS è terminato.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
